name: Java-Testumgebung

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testumgebung-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testumgebung:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        encoding: [UTF-8, US-ASCII]
    env:
      LANG: C
      LC_ALL: C
      JAVA_TOOL_OPTIONS: -Dfile.encoding=${{ matrix.encoding }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: UTF-8, JUnit und Mockito prüfen
        run: bash ./gradlew clean test --tests '*.TestEnvironmentTest' --no-daemon --console=plain
